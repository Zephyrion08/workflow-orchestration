{% extends 'accounts/base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <form method="post" style="width: 440px; padding: 30px; background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
    <h2 class="mb-4 text-center" style="font-weight: 600; color: #333;">Change Password</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <div class="mb-3">
      <label for="id_new_password" class="form-label" style="font-weight: 500;">New Password</label>
      <input type="password" id="id_new_password" name="new_password" class="form-control rounded-pill shadow-sm" style="height: 60px; font-size: 17px;" required>
    </div>

    <div class="mb-4">
      <label for="id_confirm_password" class="form-label" style="font-weight: 500;">Confirm Password</label>
      <input type="password" id="id_confirm_password" name="confirm_password" class="form-control rounded-pill shadow-sm" style="height: 60px; font-size: 17px;" required>
    </div>

    <div class="d-flex gap-3">
      <button type="submit" class="btn btn-dark rounded-pill flex-grow-1" style="height: 60px; font-weight: 600; font-size: 18px;">Change Password</button>
      <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill flex-grow-1 d-flex justify-content-center align-items-center" style="height: 60px; font-weight: 600; font-size: 18px;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
