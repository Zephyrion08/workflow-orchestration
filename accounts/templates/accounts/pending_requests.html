{% extends 'accounts/base.html' %}
{% block title %}Pending Requests{% endblock %}

{% block content %}
<h2 class="mb-4">Pending Signup Requests</h2>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Employee ID</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for req in requests %}
      <tr>
        <td>{{ req.name }}</td>
        <td>{{ req.employee_id }}</td>
        <td class="text-center">
          <a href="{% url 'create_user_from_request' req.id %}" class="btn btn-sm btn-primary me-2">
            Create User
          </a>
          <a href="{% url 'delete_signup_request' req.id %}" 
             class="btn btn-sm btn-outline-danger"
             onclick="return confirm('Are you sure you want to delete this request?');">
            Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center fst-italic text-muted">
          No pending requests.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
