<div class="card mb-3 shadow-sm border-0 kanban-card task-card" 
     data-task-id="{{ task.id }}" 
     style="border-left: 5px solid {% if task.priority == 'High' %}#dc3545{% elif task.priority == 'Medium' %}#ffc107{% else %}#0dcaf0{% endif %} !important; cursor: grab; transition: transform 0.2s ease, box-shadow 0.2s ease;">
    <div class="card-body p-3">
        <h6 class="card-title fw-bold mb-2">
            <a href="{% url 'task_detail' task.pk %}" class="text-decoration-none text-dark stretched-link">{{ task.title }}</a>
        </h6>
        
        <p class="card-text text-muted small mb-3 text-truncate" style="max-height: 40px;">
            {{ task.description|default:"No description" }}
        </p>
        
        <div class="d-flex justify-content-between align-items-center mt-auto">
            <div class="d-flex align-items-center">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2 shadow-sm" style="width: 28px; height: 28px; font-size: 0.8rem; font-weight: bold; position: relative; z-index: 2;">
                    {{ task.assigned_to.username|make_list|first|upper }}
                </div>
            </div>
            
            <div class="text-end" style="position: relative; z-index: 2;">
                 {% if task.due_date %}
                 <small class="text-muted d-block" style="font-size: 0.75rem;"><i class="bi bi-calendar fw-bold me-1"></i>{{ task.due_date|date:"M d" }}</small>
                 {% endif %}
                 <span class="badge {% if task.priority == 'High' %}bg-danger{% elif task.priority == 'Medium' %}bg-warning text-dark{% else %}bg-info text-dark{% endif %} mt-1" style="font-size: 0.7rem;">
                    {{ task.priority }}
                </span>
            </div>
        </div>
    </div>
</div>
